<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LookLens สรุปสุขภาพ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%230d5f44'/><circle cx='50' cy='50' r='20' fill='%23a8f2ce'/></svg>">
<style>
:root{--surface:#f4fbf6;--card:#fff;--container:#e8f0ea;--ink:#161d1a;--ink2:#3f4943;--muted:#66706a;--line:#dde4df;--primary:#004630;--primary2:#0d5f44;--mint:#a8f2ce;--sage:#beecb9;--red:#ba1a1a;--red-pale:#ffdad6;--amber:#9d712c;--amber-pale:#fff3d6;--shadow:0 6px 20px rgba(20,67,54,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#dfe8e2}
body{color:var(--ink);font:17px/1.55 "Plus Jakarta Sans","Noto Sans Thai",-apple-system,"Segoe UI",sans-serif}
.sv{display:block;flex:none}
button{font:inherit}
.wrap{max-width:900px;margin:0 auto;background:var(--surface);min-height:100vh;padding:0 20px 60px;box-shadow:0 0 40px rgba(0,0,0,.08)}
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,251,246,.94);backdrop-filter:blur(12px);display:flex;align-items:center;gap:12px;padding:14px 0;margin-bottom:6px;border-bottom:1px solid var(--line)}
.topbar .logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#0d5f44,#10b981);display:grid;place-items:center;color:#fff}
.topbar b{display:block;color:var(--primary);font-size:21px;line-height:1.1}.topbar small{color:var(--ink2);font-size:14px;font-weight:600}
.topbar .sp{flex:1}
.btn{border:0;border-radius:16px;padding:12px 18px;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn.p{background:var(--primary);color:#fff}.btn.s{background:var(--container);color:var(--primary)}.btn.r{background:var(--red);color:#fff}.btn.o{background:#fff;color:var(--red);border:3px solid var(--red)}.btn.w{background:#fff;color:var(--primary)}
.btn:disabled{opacity:.6;cursor:wait}
h1{font-size:34px;line-height:1.15;margin:4px 0 2px;color:var(--primary)}
h2{font-size:22px;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:26px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card.flat{background:var(--container);box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:5px 13px;font-size:13.5px;font-weight:800;background:var(--sage);color:#1c5a37}
.pill.warn{background:var(--amber-pale);color:var(--amber)}.pill.bad{background:var(--red-pale);color:var(--red)}.pill.none{background:var(--container);color:var(--muted)}
.banner{display:flex;align-items:center;gap:10px;background:var(--amber-pale);color:#7a5a1c;border-radius:18px;padding:12px 14px;font-size:15px;font-weight:600;margin:10px 0 14px}
.banner button{margin-left:auto;background:#fff;border:0;border-radius:12px;padding:8px 12px;color:var(--primary);font-weight:800;cursor:pointer;white-space:nowrap;font-size:14.5px}
.av{border-radius:50%;background:var(--sage);color:var(--primary);display:grid;place-items:center;overflow:hidden;flex:none}
.rhead{display:flex;align-items:center;gap:16px;padding:14px 0 10px}
.rhead .g{flex:1;min-width:0}.rhead p{margin:0;color:var(--muted);font-weight:600}.rhead h1{margin:0;font-size:30px}
.meta{font-size:13.5px;color:var(--muted);text-align:right}
.hero{background:linear-gradient(160deg,#dff1e5,#eef7f0);border-radius:28px;padding:18px;margin-bottom:12px}
.hero .big{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--primary)}.hero .unit{font-size:18px;color:var(--ink2);margin-left:4px}
.hero .note{margin:8px 0 0;font-size:14.5px;color:var(--ink2)}
.hero .bottom{margin-top:10px;align-items:flex-end}
.mini{width:130px;height:60px;flex:none}
.verdict{display:flex;gap:12px;border-radius:24px;padding:15px 16px;margin-bottom:12px;background:var(--card);box-shadow:var(--shadow)}
.verdict .ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--sage);color:var(--primary)}
.verdict.warn .ico{background:var(--amber-pale);color:var(--amber)}.verdict.bad .ico{background:var(--red-pale);color:var(--red)}
.verdict b{display:block;font-size:18px}.verdict ul{margin:4px 0 0;padding-left:20px;font-size:15.5px;color:var(--ink2)}.verdict li{margin:2px 0}
.fallcard{background:var(--red);color:#fff;border-radius:28px;padding:18px;margin-bottom:12px}
.fallcard .head{display:flex;gap:14px;align-items:center}
.fallcard .ex{width:60px;height:60px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;flex:none}
.fallcard h3{margin:0;font-size:23px}.fallcard p{margin:2px 0 0;opacity:.95;font-size:15.5px}
.fallcard .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.fallcard .acts .btn{flex:1;min-width:200px}
.nudge{display:flex;gap:12px;align-items:center;background:var(--amber-pale);border-radius:24px;padding:15px 16px;margin-bottom:12px}
.nudge .ico{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--amber);display:grid;place-items:center;flex:none}
.nudge b{display:block;font-size:17px}.nudge p{margin:2px 0 0;font-size:15px;color:#6b5217}
.arrows{display:flex;gap:8px}.arrows button{width:46px;height:46px;border-radius:50%;border:0;background:#fff;color:var(--ink2);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.arrows button.dark{background:var(--primary);color:#fff}.arrows button:disabled{opacity:.35;cursor:default}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:12px 0 14px}
.tile{border-radius:26px;padding:16px;position:relative;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.tile .lab{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;color:var(--ink2)}
.tile .lab .tic{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center;color:var(--primary)}
.tile .val{font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:8px;color:var(--ink)}.tile .val small{font-size:15px;font-weight:700;color:var(--ink2);margin-left:3px;letter-spacing:0}
.tile .sub2{font-size:13.5px;color:var(--ink2);margin-top:4px}
.tile.a{background:#dcefe3}.tile.b{background:#e6f2d3}.tile.c{background:#d8ecea}
.tile .chart{margin-top:auto;padding-top:10px}.tile .chart svg{width:100%;height:auto;display:block}
.seg{display:flex;background:var(--container);border-radius:30px;padding:4px;margin:10px 0 6px}
.seg button{flex:1;border:0;background:none;border-radius:26px;padding:11px 4px;font-weight:800;color:var(--ink2);cursor:pointer;font-size:16px}.seg button.on{background:var(--primary);color:#fff}
.two{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:center}
.gauge{display:block;width:100%;max-width:300px;margin:6px auto 0}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:center;font-size:13.5px;color:var(--ink2);margin:2px 0 8px}.legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.mchips{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.mchip{border:0;background:var(--container);color:var(--ink2);font-weight:800;font-size:15px;border-radius:20px;padding:9px 16px;cursor:pointer}.mchip.on{background:var(--primary);color:#fff}
.bars{width:100%;height:auto;display:block}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th,table.t td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--muted);font-weight:800;font-size:13.5px}
table.t tr.today td{font-weight:800;background:#eef7f0}
table.t td.bad{color:var(--red);font-weight:800}
.foot{font-size:13.5px;color:var(--ink2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:#fff;border-radius:16px;padding:14px 18px;font-size:16px;z-index:60;max-width:calc(100% - 32px)}.toast[hidden]{display:none}
@media(max-width:760px){.tiles{grid-template-columns:1fr}.two{grid-template-columns:1fr}.wrap{padding:0 14px 40px}}
/* the printed / saved report */
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff}
  .wrap{box-shadow:none;max-width:none;padding:0}
  .topbar,.noexport,.arrows,.seg,.mchips,.banner,.toast{display:none!important}
  .card,.hero,.tile,.verdict,.fallcard,.nudge{break-inside:avoid;box-shadow:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
body.exporting .noexport,body.exporting .arrows,body.exporting .seg,body.exporting .mchips,body.exporting .banner{display:none!important}
body.exporting .wrap{box-shadow:none;max-width:820px;margin:0;padding:0 16px}
</style>
<script src="carely-shared.js"></script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="logo" data-ic="leaf" data-s="26"></div>
    <div><b>LookLens</b><small>Summary · รายงานสรุปสุขภาพ</small></div>
    <div class="sp"></div>
    <a class="btn s" href="family.html" data-ic-label="back"></a>
    <button class="btn p" id="btnPdf" type="button"></button>
  </div>
  <div id="report"></div>
  <div class="card flat foot noexport" style="margin-top:14px">ปุ่ม “ส่งออก PDF” สร้างไฟล์ให้ดาวน์โหลดทันที ถ้าสร้างไม่ได้ (เช่นไม่มีอินเทอร์เน็ตสำหรับไลบรารี PDF) จะเปิดหน้าต่างพิมพ์ให้เลือก “บันทึกเป็น PDF” แทน</div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const IC = Object.assign({
  leaf: '<path d="M11 20A7 7 0 019.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/>',
  check: '<path d="M5 12l4.5 4.5L19 7"/>',
  checkCircle: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
  alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
  phone: '<path d="M5 3h4l2 5-2.5 1.5a11 11 0 006 6L16 13l5 2v4a2 2 0 01-2 2A16 16 0 013 5a2 2 0 012-2z"/>',
  chair: '<path d="M7 4h10v8H7zM5 12h14v3H5zM7 15v5M17 15v5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  download: '<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',
  contact: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="10" cy="11" r="2.5"/><path d="M6 17c.5-2 2-3 4-3s3.5 1 4 3M16 9h3M16 13h3"/>',
}, CARELY.ICONS);
const ic = (n, s = 24) => `<svg class="sv" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n] || IC.info}</svg>`;
document.querySelectorAll('[data-ic]').forEach(el => { el.innerHTML = ic(el.dataset.ic, +el.dataset.s || 24); });
document.querySelector('[data-ic-label=back]').innerHTML = `${ic('chevronLeft', 22)}กลับแอปลูกหลาน`;
</script>
<script>
'use strict';
const fmtDur = CARELY.fmtDur;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const hhmm = ts => new Date(ts).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } } };
const elderName = () => CARELY.profile('elder').name;
const phoneRaw = () => store.get('carely-phone', ''), phoneTel = () => phoneRaw().replace(/[^\d+]/g, '');
const photoOf = (role, size) => CARELY.avatar(role, ic('user', size));
const dayLabel = key => { const [y, m, d] = key.split('-').map(Number), dt = new Date(y, m - 1, d); return `${CARELY.TH_DOW[dt.getDay()]} ${d} ${TH_MONTHS[m - 1]}`; };
function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 3600); }
$('btnPdf').innerHTML = `${ic('download', 22)}ส่งออก PDF`;

// ================= data: what the phone (home screen) sends, or what this PC recorded =================
let snap = null;
try { const r = JSON.parse(localStorage.getItem('carely-remote') || 'null'); if (r) CARELY.remote = r; } catch {}
const online = () => !!snap && Date.now() - snap.ts < 4000;
function readStored() { try { const s = JSON.parse(localStorage.getItem('carely-live') || 'null'); if (s && (!snap || s.ts > snap.ts)) snap = s; } catch {} }
const bus = CARELY.makeBus('family');
bus.on(m => {
  if (m.type === 'state') { snap = m.snap; if (m.snap.extra) CARELY.remote = m.snap.extra; }
  else if (m.type === '_relay') bus.send({ type: 'hello' });
});
const summary = () => CARELY.summarize(snap, online(), store.get('carely-mode', 'auto'));

// ================= charts (inline SVG) =================
const bucket12 = times => { const a = new Array(12).fill(0); (times || []).forEach(ts => { a[Math.floor(new Date(ts).getHours() / 2)]++; }); return a; };
function miniBars(arr) {
  const w = 130, h = 60, n = arr.length, bw = 6, gap = (w - n * bw) / (n - 1);
  return `<svg class="mini" viewBox="0 0 ${w} ${h}" aria-hidden="true">${arr.map((v, i) => { const bh = v ? 22 + Math.min(3, v) * 11 : 10; return `<rect x="${(i * (bw + gap)).toFixed(1)}" y="${((h - bh) / 2).toFixed(1)}" width="${bw}" height="${bh}" rx="3" fill="${v ? '#0d5f44' : '#c9d6cd'}"/>`; }).join('')}</svg>`;
}
function areaChart(arr, color) {
  const w = 150, h = 74, max = Math.max(2, ...arr), pts = arr.map((v, i) => [i * (w / (arr.length - 1)), h - 8 - (v / max) * (h - 18)]);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const peak = pts.reduce((a, p) => p[1] < a[1] ? p : a, pts[0]);
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${line} L${w},${h} L0,${h} Z" fill="${color}" opacity=".22"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${peak[0].toFixed(1)}" cy="${peak[1].toFixed(1)}" r="4" fill="#fff" stroke="${color}" stroke-width="2.5"/></svg>`;
}
function arcPath(cx, cy, r, a0, a1) { const p = a => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)]; const [x0, y0] = p(a0), [x1, y1] = p(a1); return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; }
function gauge(hours) {
  const MAX = 10, segs = [[0, 4, '#10b981'], [4, 7, '#f8b84e'], [7, 10, '#e0614f']], ang = v => 180 + (Math.min(v, MAX) / MAX) * 180;
  const v = Math.min(hours, MAX), a = ang(v), kx = 120 + 92 * Math.cos(a * Math.PI / 180), ky = 120 + 92 * Math.sin(a * Math.PI / 180);
  const kc = (segs.find(s => v <= s[1]) || segs[2])[2];
  return `<svg class="gauge" viewBox="0 0 240 150" role="img" aria-label="นั่งรวม ${hours.toFixed(1)} ชั่วโมง">
    ${segs.map(s => `<path d="${arcPath(120, 120, 92, ang(s[0]) + 2, ang(s[1]) - 2)}" fill="none" stroke="${s[2]}" stroke-width="20" stroke-linecap="round"/>`).join('')}
    <circle cx="${kx.toFixed(1)}" cy="${ky.toFixed(1)}" r="12" fill="#fff" stroke="${kc}" stroke-width="5"/>
    <text x="120" y="108" text-anchor="middle" font-size="40" font-weight="800" fill="#161d1a">${hours.toFixed(1)}</text>
    <text x="120" y="128" text-anchor="middle" font-size="13" fill="#6f7973">ชม. · นั่งรวม</text>
    <text x="22" y="142" text-anchor="middle" font-size="11" fill="#6f7973">0</text><text x="218" y="142" text-anchor="middle" font-size="11" fill="#6f7973">10</text></svg>`;
}
function barChart(items, band) {
  const W = 420, H = 190, top = 28, bottom = 28, n = items.length || 1, innerW = W - 20;
  const maxV = Math.max(4, ...items.map(i => i.value), band ? band.hi : 0) * 1.2, y = v => top + (H - top - bottom) * (1 - v / maxV);
  const slot = innerW / n, bw = Math.min(34, slot * 0.58);
  let s = `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img"><defs><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.3" fill="#b8c7bd"/></pattern></defs>`;
  if (band) s += `<rect x="10" y="${y(band.hi).toFixed(1)}" width="${innerW}" height="${(y(band.lo) - y(band.hi)).toFixed(1)}" fill="#10b981" opacity=".12"/><line x1="10" x2="${W - 10}" y1="${y(band.hi).toFixed(1)}" y2="${y(band.hi).toFixed(1)}" stroke="#10b981" stroke-dasharray="4 4" opacity=".6"/>`;
  items.forEach((it, i) => {
    const x = 10 + slot * i + (slot - bw) / 2, yy = y(it.value), hgt = Math.max(3, H - bottom - yy), on = i === items.length - 1;
    s += `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${hgt.toFixed(1)}" rx="9" fill="${on ? '#0d5f44' : 'url(#dots)'}"/>`;
    s += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#6f7973">${esc(it.label)}</text>`;
    if (on) {
      const tag = it.tag || String(+it.value.toFixed(1)), tw = 14 + tag.length * 7;
      s += `<rect x="${(x + bw / 2 - tw / 2).toFixed(1)}" y="${(yy - 24).toFixed(1)}" width="${tw}" height="18" rx="9" fill="${it.warn ? '#fff3d6' : '#d9f2e2'}"/><text x="${(x + bw / 2).toFixed(1)}" y="${(yy - 11).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="${it.warn ? '#9d712c' : '#1c5a37'}">${esc(tag)}</text>`;
    }
  });
  return s + '</svg>';
}

// ================= the report =================
let dayIdx = 0, period = 'day', metric = 'bath';
function aggregate(S) {
  const days = S.days, idx = Math.min(dayIdx, days.length - 1), day = days[idx];
  if (period === 'day') {
    const times = metric === 'stand' ? day.standTimes : day.bathTimes, b = bucket12(times);
    return { items: b.map((v, i) => ({ label: i % 2 === 0 ? String(i * 2) : '', value: v })), sitH: day.sitMin / 60, shares: [day.sitMin, day.standMin, day.lieMin], note: 'ช่วงละ 2 ชั่วโมง' };
  }
  const val = d => metric === 'bath' ? (d.bathroom ?? 0) : metric === 'stand' ? d.standUps : +(d.sitMin / 60).toFixed(1);
  let groups;
  if (period === 'week') groups = days.slice(idx, idx + 7).reverse().map(d => ({ label: CARELY.TH_DOW[new Date(d.key + 'T00:00:00').getDay()], list: [d] }));
  else groups = [3, 2, 1, 0].map(w => days.slice(idx + w * 7, idx + w * 7 + 7)).map((l, i) => ({ label: ['3 สป.ก่อน', '2 สป.ก่อน', '1 สป.ก่อน', 'สัปดาห์นี้'][i], list: l })).filter(g => g.list.length);
  const items = groups.map(g => ({ label: g.label, value: g.list.reduce((a, d) => a + val(d), 0) / g.list.length }));
  const all = groups.flatMap(g => g.list), avg = k => all.length ? all.reduce((a, d) => a + d[k], 0) / all.length : 0;
  return { items, sitH: avg('sitMin') / 60, shares: [avg('sitMin'), avg('standMin'), avg('lieMin')], note: period === 'week' ? 'ค่าต่อวัน 7 วันล่าสุด' : 'ค่าเฉลี่ยต่อวัน รายสัปดาห์' };
}
function render() {
  const S = summary(), lim = CARELY.sitLimit(), days = S.days, idx = Math.min(dayIdx, days.length - 1), day = days[idx], isToday = idx === 0;
  const prev = days[idx + 1], ev = CARELY.evaluate(day, S.normal, lim), name = esc(elderName()), s = snap || {};
  const dl = isToday ? 'วันนี้' : dayLabel(day.key);
  const liveAlert = online() && s.alert && s.alert.status !== 'resolved' && isToday;
  const fallTs = (S.notifs.find(n => n.kind === 'fall') || {}).ts;
  const callBtn = phoneTel() ? `<a class="btn w noexport" href="tel:${phoneTel()}">${ic('phone', 22)}โทรหา${name} · ${esc(phoneRaw())}</a>` : '';
  const fall = (day.falls > 0 || liveAlert) ? `<div class="fallcard"><div class="head"><div class="ex">${ic('alert', 34)}</div><div><h3>ตรวจพบการล้ม${day.falls > 1 ? ` ${day.falls} ครั้ง` : ''}</h3><p>${fallTs ? hhmm(fallTs) + ' น. · ' : ''}โทรหา${name}ทันทีเพื่อตรวจสอบว่าปลอดภัยไหม ถ้าไม่รับสายให้โทร 1669</p></div></div><div class="acts noexport">${callBtn}<a class="btn o" href="tel:1669" style="border-color:#fff;background:transparent;color:#fff">${ic('phone', 22)}โทร 1669</a></div></div>` : '';
  const normalTxt = day.bathroom == null ? 'ยังไม่ได้เชื่อมเซนเซอร์ห้องน้ำ' : S.normal.source === 'own' ? `ปกติของ${elderName()} ${S.normal.lo}–${S.normal.hi} ครั้ง/วัน (จากเฉลี่ย ${S.normal.n} วัน)` : `ค่าอ้างอิงทั่วไป ${S.normal.lo}–${S.normal.hi} ครั้ง/วัน`;
  const bathPill = { ok: ['', 'ปกติ'], high: ['warn', 'บ่อยกว่าปกติ'], low: ['warn', 'น้อยกว่าปกติ'], none: ['none', 'ไม่มีข้อมูล'] }[ev.bath];
  const hero = `<div class="hero"><div class="row"><b style="font-size:18px">ไปห้องน้ำ · ${dl}</b><span class="pill ${bathPill[0]}">${bathPill[1]}</span></div>
    <div class="row bottom"><div><span class="big">${day.bathroom ?? '–'}</span><span class="unit">ครั้ง</span><p class="note">${esc(normalTxt)}</p></div>${miniBars(bucket12(day.bathTimes))}</div></div>`;
  const vTitle = ev.level === 'ok' ? `${dl}ปกติ ไม่พบเรื่องที่ต้องกังวล` : ev.level === 'warn' ? `${dl}มีเรื่องที่ควรจับตา` : 'มีเหตุฉุกเฉิน';
  const verdict = `<div class="verdict ${ev.level}"><div class="ico">${ic(ev.level === 'ok' ? 'checkCircle' : 'alert', 26)}</div><div><b>${vTitle}</b>${ev.reasons.length ? `<ul>${ev.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}</div></div>`;
  const curSit = day.curSit || 0;
  const nudge = isToday && (curSit >= lim || day.sitMax >= lim) ? `<div class="nudge"><div class="ico">${ic('clock', 26)}</div><div><b>${curSit >= lim ? `นั่งต่อเนื่องมา ${fmtDur(curSit)} แล้ว` : `วันนี้นั่งต่อเนื่องนานสุด ${fmtDur(day.sitMax)}`}</b><p>นั่งนานเกิน ${lim} นาที ควรชวน${name}ลุกขยับ</p></div></div>` : '';
  const stand = bucket12(day.standTimes), delta = (a, b) => b == null ? '' : `${a - b >= 0 ? '+' : '−'}${fmtDur(Math.abs(a - b))} จากวันก่อน`;
  const standChip = { ok: 'ลุกพอเหมาะ', low: 'ลุกน้อย', high: 'ลุกบ่อย' }[ev.stand];
  const tiles = `<div class="tiles">
    <div class="tile a"><div class="lab"><span>ลุกยืน</span><span class="tic">${ic('up', 20)}</span></div><div class="val">${day.standUps}<small>ครั้ง</small></div><div class="sub2">${standChip} · ยืน/เดิน ${fmtDur(day.standMin)}</div><div class="chart">${areaChart(stand, '#0d5f44')}</div></div>
    <div class="tile b"><div class="lab"><span>นั่ง</span><span class="tic">${ic('chair', 20)}</span></div><div class="val">${fmtDur(day.sitMin).replace(' ชม. ', '<small>ชม.</small> ').replace(' น.', '<small>น.</small>')}</div><div class="sub2">นานสุด ${fmtDur(day.sitMax)}${prev ? ' · ' + delta(day.sitMin, prev.sitMin) : ''}</div></div>
    <div class="tile c"><div class="lab"><span>นอน / อยู่ต่ำ</span><span class="tic">${ic('moon', 20)}</span></div><div class="val">${fmtDur(day.lieMin).replace(' ชม. ', '<small>ชม.</small> ').replace(' น.', '<small>น.</small>')}</div><div class="sub2">${prev ? delta(day.lieMin, prev.lieMin) : 'ช่วงที่กล้อง/เซนเซอร์เห็น'}</div></div></div>`;
  const A = aggregate(S), tot = A.shares.reduce((a, b) => a + b, 0) || 1, pc = v => Math.round(100 * v / tot);
  const bandOn = metric === 'bath' && period !== 'day' ? S.normal : null, lastIt = A.items[A.items.length - 1];
  if (lastIt && metric === 'bath' && period !== 'day') { lastIt.tag = lastIt.value > S.normal.hi ? 'สูง' : lastIt.value < S.normal.lo ? 'ต่ำ' : 'ปกติ'; lastIt.warn = lastIt.tag !== 'ปกติ'; }
  const mName = { bath: 'ไปห้องน้ำ (ครั้ง)', stand: 'ลุกยืน (ครั้ง)', sit: 'นั่ง (ชม.)' }[metric];
  const reports = `<div class="card"><div class="row"><h2>รายงาน · ${mName}</h2><span class="muted" style="font-size:14px">${A.note}</span></div>
    <div class="seg">${[['day', 'วัน'], ['week', 'สัปดาห์'], ['month', 'เดือน']].map(([k, l]) => `<button class="${period === k ? 'on' : ''}" data-period="${k}" type="button">${l}</button>`).join('')}</div>
    <div class="two"><div>${gauge(A.sitH)}
    <div class="legend"><span><b style="background:#10b981"></b>ปกติ &lt; 4 ชม.</span><span><b style="background:#f8b84e"></b>ควรลุก 4–7</span><span><b style="background:#e0614f"></b>นานเกิน &gt; 7</span></div>
    <div class="legend"><span><b style="background:#f8b84e"></b>นั่ง ${pc(A.shares[0])}%</span><span><b style="background:#10b981"></b>ยืน/เดิน ${pc(A.shares[1])}%</span><span><b style="background:#5aa9a0"></b>นอน ${pc(A.shares[2])}%</span></div></div>
    <div><div class="mchips">${[['bath', 'ห้องน้ำ'], ['stand', 'ลุกยืน'], ['sit', 'นั่ง (ชม.)']].filter(([k]) => !(period === 'day' && k === 'sit')).map(([k, l]) => `<button class="mchip ${metric === k && !(period === 'day' && metric === 'sit') ? 'on' : ''}" data-metric="${k}" type="button">${l}</button>`).join('')}</div>
    ${barChart(A.items, bandOn)}</div></div></div>`;
  // table of the last days, for the saved report
  const rows = days.slice(0, 7).map((d, i) => `<tr class="${i === idx ? 'today' : ''}"><td>${i === 0 ? 'วันนี้ · ' : ''}${dayLabel(d.key)}</td><td>${d.bathroom ?? '–'}</td><td>${d.standUps}</td><td>${fmtDur(d.sitMin)}</td><td>${fmtDur(d.sitMax)}</td><td>${fmtDur(d.lieMin)}</td><td class="${d.falls ? 'bad' : ''}">${d.falls}</td></tr>`).join('');
  const table = `<div class="card"><div class="row"><h2>ตารางย้อนหลัง</h2><span class="muted" style="font-size:14px">${Math.min(7, days.length)} วันล่าสุด</span></div>
    <table class="t"><thead><tr><th>วัน</th><th>ห้องน้ำ</th><th>ลุกยืน</th><th>นั่งรวม</th><th>นั่งนานสุด</th><th>นอน/อยู่ต่ำ</th><th>ล้ม</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  const when = new Date();
  const html = `${S.mode === 'sample' ? `<div class="banner">${ic('info', 20)}<span>กำลังแสดงข้อมูลตัวอย่าง (ยังไม่มีข้อมูลจริง)</span><button data-mode="live" type="button">ใช้ข้อมูลจริง</button></div>` : ''}
  <div class="rhead"><div class="av" style="width:68px;height:68px">${photoOf('elder', 34)}</div><div class="g"><p>รายงานสรุปสุขภาพ</p><h1>${name}</h1></div>
    <div class="meta">${dayLabel(CARELY.dKey(when))} ${hhmm(when)} น.<br><span class="pill ${S.mode === 'sample' ? 'warn' : ''}">${S.mode === 'sample' ? 'ข้อมูลตัวอย่าง' : online() ? 'ข้อมูลสด' : 'ข้อมูลที่บันทึกไว้'}</span></div></div>
  ${fall}${hero}${verdict}${nudge}
  <div class="row" style="margin-top:6px"><div><h2>ภาพรวม</h2><span class="muted" style="font-size:14px">${dl}</span></div><div class="arrows"><button data-day="1" type="button" aria-label="วันก่อนหน้า" ${idx >= days.length - 1 ? 'disabled' : ''}>${ic('chevronLeft', 22)}</button><button class="dark" data-day="-1" type="button" aria-label="วันถัดไป" ${idx <= 0 ? 'disabled' : ''}>${ic('chevronRight', 22)}</button></div></div>
  ${tiles}${reports}${table}
  <div class="card flat foot">ต้นแบบสำหรับสาธิต ไม่ใช่อุปกรณ์ทางการแพทย์ ค่าปกติเป็นเกณฑ์อ้างอิงเบื้องต้นหรือค่าเฉลี่ยของท่านเอง ไม่ใช่คำวินิจฉัย ผลจากกล้องและเซนเซอร์อาจคลาดเคลื่อน</div>`;
  const root = $('report');
  if (root.dataset.sig !== html) { const y = window.scrollY; root.innerHTML = html; root.dataset.sig = html; window.scrollTo(0, y); }
}
const redraw = () => { $('report').dataset.sig = ''; render(); };
document.addEventListener('click', e => {
  const t = e.target; let el;
  if ((el = t.closest('[data-period]'))) { period = el.dataset.period; if (period === 'day' && metric === 'sit') metric = 'bath'; redraw(); }
  else if ((el = t.closest('[data-metric]'))) { metric = el.dataset.metric; redraw(); }
  else if ((el = t.closest('[data-day]'))) { dayIdx = Math.max(0, Math.min(summary().days.length - 1, dayIdx + (+el.dataset.day))); redraw(); }
  else if ((el = t.closest('[data-mode]'))) { try { localStorage.setItem('carely-mode', el.dataset.mode); } catch {} redraw(); }
});

// ================= export to PDF =================
const lib = src => new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => fail(new Error('load ' + src)); document.head.appendChild(s); });
async function buildPdf() {
  if (!window.html2canvas) await lib('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  if (!window.jspdf) await lib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  document.body.classList.add('exporting');
  try {
    await new Promise(r => setTimeout(r, 250));                                  // let the layout settle without the buttons
    const el = $('report'), canvas = await html2canvas(el, { scale: 2, backgroundColor: '#f4fbf6', useCORS: true, windowWidth: 860 });
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    const pw = 210, ph = 297, m = 10, imgW = pw - 2 * m, pageH = ph - 2 * m - 6;             // 6 mm kept for the footer
    const pxPerMm = canvas.width / imgW, sliceH = Math.floor(pageH * pxPerMm), pages = Math.max(1, Math.ceil(canvas.height / sliceH));
    for (let p = 0; p < pages; p++) {
      const h = Math.min(sliceH, canvas.height - p * sliceH), part = document.createElement('canvas');
      part.width = canvas.width; part.height = h;
      part.getContext('2d').drawImage(canvas, 0, p * sliceH, canvas.width, h, 0, 0, canvas.width, h);
      if (p) pdf.addPage();
      pdf.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', m, m, imgW, h / pxPerMm);
      pdf.setFontSize(8); pdf.setTextColor(120); pdf.text(`LookLens  -  ${p + 1} / ${pages}`, pw / 2, ph - 6, { align: 'center' });
    }
    return pdf;
  } finally { document.body.classList.remove('exporting'); }
}
async function exportPdf() {
  const btn = $('btnPdf'); btn.disabled = true; btn.innerHTML = `${ic('clock', 22)}กำลังสร้าง PDF…`;
  try {
    const pdf = await buildPdf();
    pdf.save(`LookLens-summary-${CARELY.dKey(new Date())}.pdf`);
    toast('บันทึก PDF แล้ว (ดูในโฟลเดอร์ดาวน์โหลด)');
  } catch (e) {
    console.error(e);
    toast('สร้าง PDF โดยตรงไม่ได้ เปิดหน้าต่างพิมพ์ให้แทน เลือก “บันทึกเป็น PDF”');
    setTimeout(() => window.print(), 600);
  } finally { btn.disabled = false; btn.innerHTML = `${ic('download', 22)}ส่งออก PDF`; }
}
$('btnPdf').onclick = exportPdf;
window.__buildPdf = buildPdf;

readStored(); render(); bus.send({ type: 'hello' });
setInterval(() => { readStored(); render(); }, 1000);
</script>
